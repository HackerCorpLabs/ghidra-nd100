name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']  # tag pushes are handled by release.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

# Update GHIDRA_VERSION when upgrading Ghidra. The download URL is resolved
# automatically from the GitHub Releases API.
env:
  GHIDRA_VERSION: '12.0.4'
  DOTNET_ROLL_FORWARD: Major

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ------- Ghidra (Linux) -------
      - name: Cache Ghidra (Linux)
        if: runner.os == 'Linux'
        id: cache-ghidra-linux
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}-linux

      - name: Download and extract Ghidra (Linux)
        if: runner.os == 'Linux' && steps.cache-ghidra-linux.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_${GHIDRA_VERSION}_build"
          url=$(curl -sSL "$api" | jq -r '.assets[] | select(.name | test("ghidra_.*_PUBLIC_.*\\.zip")) | .browser_download_url' | head -1)
          test -n "$url" || { echo "No Ghidra zip found for ${GHIDRA_VERSION}"; exit 1; }
          echo "Downloading $url"
          curl -sSL -o /tmp/ghidra.zip "$url"
          mkdir -p "${RUNNER_TEMP}/ghidra"
          unzip -q /tmp/ghidra.zip -d "${RUNNER_TEMP}/ghidra"
          rm /tmp/ghidra.zip

      - name: Resolve GHIDRA_INSTALL_DIR (Linux)
        if: runner.os == 'Linux'
        run: |
          dir=$(ls -d "${RUNNER_TEMP}/ghidra"/ghidra_*_PUBLIC | head -1)
          test -n "$dir" || { echo "Ghidra extraction failed"; exit 1; }
          echo "GHIDRA_INSTALL_DIR=$dir" >> "$GITHUB_ENV"

      # ------- Ghidra (Windows) -------
      - name: Cache Ghidra (Windows)
        if: runner.os == 'Windows'
        id: cache-ghidra-win
        uses: actions/cache@v4
        with:
          path: C:\ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}-win

      - name: Resolve Ghidra download URL (Windows)
        if: runner.os == 'Windows' && steps.cache-ghidra-win.outputs.cache-hit != 'true'
        id: ghidra-url
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_${{ env.GHIDRA_VERSION }}_build"
          $asset = $release.assets | Where-Object { $_.name -like "ghidra_*_PUBLIC_*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No Ghidra zip found for version ${{ env.GHIDRA_VERSION }}" }
          echo "url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          echo "name=$($asset.name)"               >> $env:GITHUB_OUTPUT

      - name: Download and extract Ghidra (Windows)
        if: runner.os == 'Windows' && steps.cache-ghidra-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url  = "${{ steps.ghidra-url.outputs.url }}"
          $name = "${{ steps.ghidra-url.outputs.name }}"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $name
          Expand-Archive -Path $name -DestinationPath C:\ghidra
          Remove-Item $name

      - name: Set GHIDRA_INSTALL_DIR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Directory C:\ghidra -Filter "ghidra_*_PUBLIC" | Select-Object -First 1
          if (-not $dir) { throw "Ghidra extraction failed under C:\ghidra" }
          echo "GHIDRA_INSTALL_DIR=$($dir.FullName)" >> $env:GITHUB_ENV

      # ------- Make on Windows (Linux ships make in the runner image) -------
      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y --no-progress make

      # ------- Build via the Makefile -------
      - name: Build (make all)
        shell: bash
        env:
          MODULE_VERSION: 0.0.0-${{ github.run_number }}
        run: make all

      - name: Locate built zip
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls -1 ND-100/dist/ghidra_*_ND-100.zip | head -1)
          test -n "$zip" || { echo "No extension zip produced"; exit 1; }
          echo "path=$zip"          >> "$GITHUB_OUTPUT"
          echo "name=$(basename $zip)" >> "$GITHUB_OUTPUT"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.os }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            ND-100/build/**
            ND-100/data/languages/*.sla
            ND-100/data/languages/*.slaspec
          if-no-files-found: ignore
          retention-days: 7
