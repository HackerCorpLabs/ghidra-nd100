name: Build and Release

on:
  push:
    tags:
      - 'v*'

# Update GHIDRA_VERSION when upgrading Ghidra. The download URL is resolved
# automatically from the GitHub Releases API.
env:
  GHIDRA_VERSION: '12.0.4'
  DOTNET_ROLL_FORWARD: Major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}-linux

      - name: Download and extract Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_${GHIDRA_VERSION}_build"
          url=$(curl -sSL "$api" | jq -r '.assets[] | select(.name | test("ghidra_.*_PUBLIC_.*\\.zip")) | .browser_download_url' | head -1)
          test -n "$url" || { echo "No Ghidra zip found for ${GHIDRA_VERSION}"; exit 1; }
          echo "Downloading $url"
          curl -sSL -o /tmp/ghidra.zip "$url"
          mkdir -p "${RUNNER_TEMP}/ghidra"
          unzip -q /tmp/ghidra.zip -d "${RUNNER_TEMP}/ghidra"
          rm /tmp/ghidra.zip

      - name: Resolve GHIDRA_INSTALL_DIR
        run: |
          dir=$(ls -d "${RUNNER_TEMP}/ghidra"/ghidra_*_PUBLIC | head -1)
          test -n "$dir" || { echo "Ghidra extraction failed"; exit 1; }
          echo "GHIDRA_INSTALL_DIR=$dir" >> "$GITHUB_ENV"

      - name: Extract version
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build extension
        env:
          MODULE_VERSION: ${{ steps.version.outputs.value }}
        run: make all

      - name: Rename zip
        id: artifact
        run: |
          set -euo pipefail
          src=$(ls -1 ND-100/dist/ghidra_*_ND-100.zip | head -1)
          test -n "$src" || { echo "Extension zip not found in ND-100/dist"; exit 1; }
          dst="ND-100/dist/ghidra-nd100-${{ steps.version.outputs.value }}.zip"
          mv -f "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"
          echo "Released as: $dst"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-nd100-${{ steps.version.outputs.value }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ steps.version.outputs.value }}
          path: |
            ND-100/build/**
            ND-100/data/languages/*.sla
            ND-100/data/languages/*.slaspec
          if-no-files-found: ignore
          retention-days: 7

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          zip="${{ steps.artifact.outputs.path }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — replacing asset"
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" \
              --title "$tag" \
              --generate-notes
          fi
